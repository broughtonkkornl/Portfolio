<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kimberly K. Broughton — React Portfolio</title>
<meta name="description" content="React-powered single-page portfolio of Kimberly K. Broughton, NASA Inventor & Systems Architect." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
<style>
:root {
  --bg: #0a0e1a; --bg-alt: #0f1525; --bg-card: #141b2e;
  --text: #e8ecf4; --muted: #9aa6bd;
  --primary: #4f8cff; --primary-light: #7fb0ff;
  --accent: #37d5a4;
  --border: rgba(255,255,255,0.08);
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
}
.app { max-width: 1100px; margin: 0 auto; padding: 0 2rem; }
section { padding: 4.5rem 0; }
h2.title {
  font-size: 2rem; text-align: center; margin-bottom: 2.5rem;
  color: #fff; letter-spacing: -0.02em;
}
h2.title::after {
  content: ''; display: block; width: 60px; height: 3px;
  margin: 0.75rem auto 0; background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 2px;
}
.eyebrow {
  font-size: 0.8rem; font-weight: 600; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--accent); text-align: center; margin-bottom: 0.5rem;
}
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.75rem;
  transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.35); border-color: rgba(79,140,255,0.35); }

/* Navbar */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(10,14,26,0.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1100px; margin: 0 auto; padding: 0 2rem;
  height: 64px; display: flex; align-items: center; justify-content: space-between;
}
.brand { font-weight: 700; font-size: 1.3rem; color: #fff; text-decoration: none; }
.brand span { color: var(--accent); }
.nav-links { display: flex; gap: 1.75rem; }
.nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
.nav-links a:hover { color: #fff; }
.nav-links a.active { color: var(--accent); }
.nav-cta {
  border: 1px solid var(--primary); border-radius: 40px;
  padding: 0.4rem 1.1rem !important; color: var(--primary-light) !important;
  transition: background 0.3s, color 0.3s;
}
.nav-cta:hover { background: var(--primary); color: #fff !important; }

/* Hero */
.hero {
  min-height: 92vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  padding: 8rem 2rem 3rem; position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse at 25% 20%, rgba(79,140,255,0.14), transparent 55%),
    radial-gradient(ellipse at 75% 80%, rgba(55,213,164,0.10), transparent 55%),
    var(--bg);
}
.hero h1 {
  font-size: clamp(2.4rem, 6vw, 4rem); color: #fff;
  margin: 1rem 0 1.25rem; letter-spacing: -0.03em;
  background: linear-gradient(135deg, #fff, var(--primary-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.hero .role { color: var(--accent); font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; font-size: 0.85rem; }
.hero p.tagline { color: var(--muted); max-width: 680px; margin-bottom: 2rem; font-size: 1.05rem; }
.btn {
  display: inline-block; padding: 0.7rem 1.6rem; border-radius: 50px;
  font-weight: 600; font-size: 0.9rem; text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s; margin: 0.25rem;
}
.btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,140,255,0.4); }
.btn-outline { border: 2px solid rgba(255,255,255,0.25); color: var(--text); }
.btn-outline:hover { border-color: var(--primary-light); color: #fff; }
.hero-contact { margin-top: 2.25rem; color: var(--muted); font-size: 0.9rem; display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; }
.hero-contact a { color: var(--muted); text-decoration: none; border-bottom: 1px solid transparent; }
.hero-contact a:hover { color: var(--primary-light); border-bottom-color: var(--primary-light); }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem; max-width: 900px; margin: 0 auto; }
.stat { text-align: center; padding: 1.75rem; }
.stat .num { font-size: 2.2rem; font-weight: 700; color: var(--accent); display: block; }
.stat .label { font-size: 0.85rem; color: var(--muted); }

/* Skills */
.skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; }
.skill-card h3 { font-size: 1.05rem; margin-bottom: 1rem; color: #fff; }
.tags { display: flex; flex-wrap: wrap; gap: 0.45rem; }
.tags span {
  background: rgba(79,140,255,0.09); border: 1px solid rgba(79,140,255,0.15);
  color: var(--text); font-size: 0.78rem; padding: 0.3rem 0.8rem; border-radius: 40px;
}

/* Experience */
.job-list { max-width: 850px; margin: 0 auto; display: grid; gap: 1.5rem; }
.job { position: relative; border-left: 3px solid var(--primary); }
.job-header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
.job-header h3 { color: #fff; font-size: 1.2rem; }
.job-date { color: var(--accent); font-size: 0.82rem; font-weight: 600; white-space: nowrap; }
.job-role { color: var(--primary-light); font-size: 0.92rem; font-weight: 500; margin-bottom: 0.4rem; }
.job-loc { color: var(--muted); font-size: 0.82rem; margin-bottom: 0.75rem; }
.job-stack { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.9rem; }
.job ul { list-style: none; }
.job ul li {
  position: relative; padding-left: 1.25rem; color: var(--muted);
  font-size: 0.9rem; margin-bottom: 0.45rem; line-height: 1.6;
}
.job ul li::before { content: '\25B8'; position: absolute; left: 0; color: var(--accent); }

/* Achievements */
.ach-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.25rem; max-width: 1000px; margin: 0 auto; }
.ach-featured {
  grid-column: 1 / -1;
  background: linear-gradient(135deg, var(--bg-card), #182240);
  border: 1px solid rgba(79,140,255,0.35); padding: 2rem;
}
.ach-featured h3 { color: #fff; font-size: 1.35rem; margin-bottom: 0.6rem; }
.ach-featured p { color: var(--muted); }
.ach-card h3 { color: #fff; font-size: 1rem; margin-bottom: 0.4rem; }
.ach-card p { color: var(--muted); font-size: 0.88rem; }
.ach-date { display: inline-block; margin-top: 0.6rem; font-size: 0.78rem; color: var(--accent); background: rgba(55,213,164,0.1); padding: 0.2rem 0.7rem; border-radius: 40px; }

/* Competencies */
.comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 1rem; max-width: 950px; margin: 0 auto; }
.comp { display: flex; align-items: center; gap: 0.85rem; padding: 1.1rem 1.4rem; font-weight: 500; cursor: default; }
.comp span { font-size: 1.25rem; }
.comp:hover { border-color: rgba(55,213,164,0.35); transform: translateX(6px); }

/* Education */
.edu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.25rem; max-width: 950px; margin: 0 auto; }
.edu h3 { color: #fff; font-size: 1.05rem; margin-bottom: 0.3rem; }
.edu p { color: var(--muted); font-size: 0.88rem; }

/* Footer */
.footer { border-top: 1px solid var(--border); padding: 4rem 0 2.5rem; text-align: center; background: var(--bg-alt); }
.footer h2 { color: #fff; font-size: 1.7rem; margin-bottom: 0.75rem; }
.footer p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
.footer-meta { font-size: 0.82rem !important; color: var(--muted); margin-top: 1.75rem !important; }

/* Section alt */
.alt { background: var(--bg-alt); }

/* Responsive */
@media (max-width: 768px) {
  .nav-links { display: none; }
  .app { padding: 0 1.25rem; }
  section { padding: 3rem 0; }
  .hero { padding: 6rem 1.25rem 2.5rem; }
  .hero-contact { flex-direction: column; gap: 0.75rem; }
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

      ]
    },

function NavBar({ active, onNav }) {
  return (
    <nav className="nav">
      <div className="nav-inner">
        <a href="#hero" className="brand" onClick={e => { e.preventDefault(); onNav('hero'); }}>KB<span>.</span></a>
        <div className="nav-links">
          {['hero','achievements','skills','experience','education'].map(id => (
            <a key={id} href={'#' + id} className={active === id ? 'active' : ''} onClick={e => { e.preventDefault(); onNav(id); }}>
              {id.charAt(0).toUpperCase() + id.slice(1)}
            </a>
          ))}
          <a href="resume.html" target="_blank" rel="noopener noreferrer" className="nav-cta" style={{ textDecoration: 'none' }}>Printable Résumé</a>
        </div>
      </div>
    </nav>
  );
}

function Section({ id, eyebrow, title, alt, children }) {
  return (
    <section id={id} className={alt ? 'alt' : ''}>
      <div className="app">
        {eyebrow && <p className="eyebrow">{eyebrow}</p>}
        <h2 className="title">{title}</h2>
        {children}
      </div>
    </section>
  );
}

function Hero({ onNav }) {
  return (
    <header className="hero" id="hero">
      <span className="role">{DATA.role}</span>
      <h1>{DATA.name}</h1>
      <p className="tagline">Recognized NASA Inventor • 17+ Years of Enterprise Software Engineering • Full-Stack, Cloud, & Automation Expertise</p>
      <div>
        <a href="#experience" className="btn btn-primary" onClick={e => { e.preventDefault(); onNav('experience'); }}>View Experience</a>
        <a href="kkb_08052026.pdf" download className="btn btn-outline">Download Résumé (PDF)</a>
      </div>
      <div className="hero-contact">
        <span>{DATA.location}</span>
        <a href="tel:18657429443">{DATA.phone}</a>
        <a href="mailto:kimberly.broughton@gmail.com">{DATA.email}</a>
      </div>
    </header>
  );
}

function App() {
  const [active, setActive] = React.useState('hero');
  const scrollTo = id => {
    const el = document.getElementById(id);
    if (el) { window.scrollTo({ top: el.offsetTop - 64, behavior: 'smooth' }); }
    setActive(id);
  };
  React.useEffect(() => {
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => { if (entry.isIntersecting) setActive(entry.target.id); });
    }, { rootMargin: '-40% 0px -55% 0px' });
    ['hero','achievements','skills','experience','education'].forEach(id => {
      const el = document.getElementById(id); if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, []);

  return (
    <div>
      <NavBar active={active} onNav={scrollTo} />
      <Hero onNav={scrollTo} />

      <Section id="achievements" eyebrow="Highlights" title="Significant Achievements">
        <div className="ach-grid">
          <div className="card ach-featured">
            <h3>🚀 {DATA.achievements.featured.title}</h3>
            <p>{DATA.achievements.featured.text}</p>
            <div style={{ marginTop: '1rem' }}>
              {DATA.achievements.featured.links.map(l => (
                <a key={l.label} href={l.href} target="_blank" rel="noopener noreferrer" className="btn btn-outline" style={{ fontSize: '0.8rem' }}>{l.label}</a>
              ))}
            </div>
          </div>
          {DATA.achievements.list.map(a => (
            <div key={a.title} className="card ach-card">
              <h3>{a.icon} {a.title}</h3>
              <p>{a.text}</p>
              {a.date && <span className="ach-date">{a.date}</span>}
            </div>
          ))}
        </div>
      </Section>

      <Section id="skills" eyebrow="What I Work With" title="Technical Skills" alt>
        <div className="skills-grid">
          {DATA.skills.map(s => (
            <div key={s.title} className="card skill-card">
              <h3>{s.title}</h3>
              <div className="tags">{s.tags.map(t => <span key={t}>{t}</span>)}</div>
            </div>
          ))}
        </div>
      </Section>

      <Section id="competencies" eyebrow="Areas of Expertise" title="Core Competencies">
        <div className="comp-grid">
          {DATA.competencies.map(c => <div key={c} className="card comp"><span>{c.split(' ')[0]}</span><span>{c.split(' ').slice(1).join(' ')}</span></div>)}
        </div>
      </Section>

      <Section id="experience" eyebrow="Career" title="Professional Experience" alt>
        <div className="job-list">
          {DATA.jobs.map(j => (
            <div key={j.company} className="card job">
              <div className="job-header">
                <h3>{j.company}</h3>
                <span className="job-date">{j.date}</span>
              </div>
              <p className="job-role">{j.role}</p>
              <p className="job-loc">📍 {j.loc}</p>
              <p className="job-stack"><strong>Developed in:</strong> {j.stack}</p>
              <ul>{j.bullets.map(b => <li key={b}>{b}</li>)}</ul>
            </div>
          ))}
        </div>
      </Section>

      <Section id="education" eyebrow="Learning" title="Education & Certifications">
        <div className="edu-grid">
          {DATA.education.map(e => (
            <div key={e.title} className="card edu">
              <h3>{e.title}</h3>
              <p>{e.school}</p>
              {e.extra && <p style={{ color: 'var(--primary-light)' }}>{e.extra}</p>}
              <span className="ach-date">{e.date}</span>
            </div>
          ))}
        </div>
      </Section>

      <div className="stats" style={{ margin: '3rem auto 0' }}>
        {DATA.stats.map(s => (
          <div key={s.label} className="card stat">
            <span className="num">{s.num}</span>
            <span className="label">{s.label}</span>
          </div>
        ))}
      </div>

      <footer className="footer">
        <div className="app">
          <h2>Let's Connect</h2>
          <p>Open to opportunities in software architecture, full-stack development, and cloud modernization.</p>
          <div>
            <a href="mailto:kimberly.broughton@gmail.com" className="btn btn-primary">✉️ Email Me</a>
            <a href="kkb_08052026.pdf" download className="btn btn-outline">📄 Download Résumé</a>
            <a href="resume.html" target="_blank" rel="noopener noreferrer" className="btn btn-outline">🖨️ Printable Version</a>
          </div>
          <p className="footer-meta">{DATA.location} • {DATA.phone} • {DATA.email}</p>
          <p style={{ fontSize: '0.78rem', marginTop: '0.5rem' }}>© {new Date().getFullYear()} Kimberly K. Broughton • Built with React</p>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
