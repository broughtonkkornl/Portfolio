<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kimberly K. Broughton — React Portfolio</title>
  <meta name="description" content="React-powered portfolio of Kimberly K. Broughton, Systems Architect and NASA Inventor." />
  <link rel="stylesheet" href="css/style.css?v=20260818" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <style>
    .react-scroll-progress { position: fixed; inset: 0 auto auto 0; z-index: 2000; width: 100%; height: 3px; background: transparent; pointer-events: none; }
    .react-scroll-progress > span { display: block; height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, #37d5a4, #4f8cff); box-shadow: 0 0 14px rgba(55, 213, 164, 0.8); }
    .react-impact { position: relative; z-index: 2; margin: -3.25rem auto 0; max-width: 1100px; padding: 0 2rem; }
    .react-impact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; overflow: hidden; border: 1px solid rgba(127, 176, 255, 0.28); border-radius: 18px; background: rgba(127, 176, 255, 0.18); box-shadow: 0 18px 50px rgba(0,0,0,0.25); }
    .react-impact-card { min-height: 132px; padding: 1.4rem 1.6rem; background: linear-gradient(145deg, rgba(20, 27, 46, 0.98), rgba(15, 21, 37, 0.98)); }
    .react-impact-label { color: #9aa6bd; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; }
    .react-impact-value { display: block; margin: 0.35rem 0; color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.55rem, 3vw, 2.2rem); font-weight: 700; }
    .react-impact-detail { color: #c4cce0; font-size: 0.84rem; line-height: 1.45; }
    .react-explorer { margin-top: 1.25rem; border: 1px solid rgba(127, 176, 255, 0.2); border-radius: 18px; overflow: hidden; background: linear-gradient(135deg, rgba(20,27,46,0.96), rgba(10,14,26,0.96)); box-shadow: var(--shadow); }
    .react-explorer-head { padding: 1.75rem 1.75rem 0; }
    .react-explorer-kicker { color: #37d5a4; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .react-explorer-title { margin-top: 0.35rem; color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.3rem, 3vw, 1.8rem); }
    .react-explorer-tabs { display: flex; gap: 0.55rem; flex-wrap: wrap; padding: 1.4rem 1.75rem; }
    .react-explorer-tab { border: 1px solid rgba(127,176,255,0.25); border-radius: 999px; background: transparent; color: #c4cce0; cursor: pointer; font: inherit; font-size: 0.84rem; font-weight: 600; padding: 0.52rem 0.9rem; transition: all 0.2s ease; }
    .react-explorer-tab:hover, .react-explorer-tab[aria-pressed='true'] { border-color: #37d5a4; background: rgba(55,213,164,0.1); color: #fff; }
    .react-explorer-content { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(230px, .85fr); gap: 2rem; padding: 0 1.75rem 1.75rem; }
    .react-explorer-copy { color: #c4cce0; line-height: 1.7; }
    .react-explorer-proof { display: grid; align-content: start; gap: 0.7rem; }
    .react-proof { padding: 0.75rem 0.9rem; border-left: 2px solid #37d5a4; background: rgba(255,255,255,0.035); color: #e8ecf4; font-size: 0.88rem; }
    @media (max-width: 700px) { .react-impact { margin-top: -1.25rem; padding: 0 1rem; } .react-impact-grid { grid-template-columns: 1fr; } .react-impact-card { min-height: auto; } .react-explorer-content { grid-template-columns: 1fr; gap: 1rem; } }
  </style>
</head>
<body>
  <div id="root" aria-live="polite">Loading portfolio…</div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>
    (function () {
      'use strict';

      const { useEffect, useState } = React;

      function usePortfolioInteractions(isReady) {
        useEffect(function () {
          if (!isReady) return undefined;

          const navbar = document.getElementById('navbar');
          const navToggle = document.getElementById('navToggle');
          const navLinks = document.getElementById('navLinks');
          const cleanups = [];

          if (navbar) {
            const handleScroll = function () {
              navbar.classList.toggle('scrolled', window.scrollY > 50);
            };
            window.addEventListener('scroll', handleScroll, { passive: true });
            handleScroll();
            cleanups.push(function () { window.removeEventListener('scroll', handleScroll); });
          }

          if (navToggle && navLinks) {
            const toggleNavigation = function () {
              const isOpen = navLinks.classList.toggle('open');
              navToggle.classList.toggle('open', isOpen);
              navToggle.setAttribute('aria-expanded', String(isOpen));
            };
            const closeNavigation = function () {
              navLinks.classList.remove('open');
              navToggle.classList.remove('open');
              navToggle.setAttribute('aria-expanded', 'false');
            };
            navToggle.addEventListener('click', toggleNavigation);
            navLinks.querySelectorAll('a').forEach(function (link) {
              link.addEventListener('click', closeNavigation);
            });
            cleanups.push(function () {
              navToggle.removeEventListener('click', toggleNavigation);
              navLinks.querySelectorAll('a').forEach(function (link) {
                link.removeEventListener('click', closeNavigation);
              });
            });
          }

          const anchors = document.querySelectorAll('a[href^="#"]');
          const smoothScroll = function (event) {
            const target = document.querySelector(event.currentTarget.getAttribute('href'));
            if (!target) return;
            event.preventDefault();
            const top = target.getBoundingClientRect().top + window.pageYOffset - 70;
            window.scrollTo({ top: top, behavior: 'smooth' });
          };
          anchors.forEach(function (anchor) { anchor.addEventListener('click', smoothScroll); });
          cleanups.push(function () {
            anchors.forEach(function (anchor) { anchor.removeEventListener('click', smoothScroll); });
          });

          const revealElements = document.querySelectorAll('.reveal');
          if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver(function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add('visible');
                  observer.unobserve(entry.target);
                }
              });
            }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
            revealElements.forEach(function (element) { observer.observe(element); });
            cleanups.push(function () { observer.disconnect(); });
          } else {
            revealElements.forEach(function (element) { element.classList.add('visible'); });
          }

          document.querySelectorAll('.footer-copy').forEach(function (element) {
            element.innerHTML = element.innerHTML.replace('2026', String(new Date().getFullYear()));
          });

          return function () { cleanups.forEach(function (cleanup) { cleanup(); }); };
        }, [isReady]);
      }

      function HtmlBlock(props) {
        return React.createElement('div', {
          dangerouslySetInnerHTML: { __html: props.markup }
        });
      }

      function Navigation(props) { return React.createElement(HtmlBlock, props); }
      function Hero(props) { return React.createElement(HtmlBlock, props); }
      function About(props) { return React.createElement(HtmlBlock, props); }
      function Achievements(props) { return React.createElement(HtmlBlock, props); }
      function Skills(props) { return React.createElement(HtmlBlock, props); }
      function Competencies(props) { return React.createElement(HtmlBlock, props); }
      function Experience(props) { return React.createElement(HtmlBlock, props); }
      function Education(props) { return React.createElement(HtmlBlock, props); }
      function GitHubIcon() {
        return React.createElement('svg', { className: 'contact-icon', viewBox: '0 0 16 16', 'aria-hidden': 'true', focusable: 'false' },
          React.createElement('path', { d: 'M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82A7.65 7.65 0 0 1 8 4.73c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z' })
        );
      }

      function ScrollProgress() {
        const h = React.createElement;
        const [progress, setProgress] = useState(0);
        useEffect(function () {
          const updateProgress = function () {
            const maximum = document.documentElement.scrollHeight - window.innerHeight;
            setProgress(maximum > 0 ? Math.min(window.scrollY / maximum, 1) : 0);
          };
          window.addEventListener('scroll', updateProgress, { passive: true });
          updateProgress();
          return function () { window.removeEventListener('scroll', updateProgress); };
        }, []);
        return h('div', { className: 'react-scroll-progress', 'aria-hidden': 'true' },
          h('span', { style: { transform: 'scaleX(' + progress + ')' } })
        );
      }

      function ImpactDashboard() {
        const h = React.createElement;
        const cards = [
          ['Recognition', 'NASA Inventor', 'Earthdata Pub — NASA Case No. GSC-18, 612-1.'],
          ['Reach', '12 NASA DAACs', 'Earthdata Pub applications used by all DAACs and data producers.'],
          ['Delivery', 'MVP live', 'Ingest Dashboard delivered for ORNL DAAC ingest operations.']
        ];
        return h('section', { className: 'react-impact', 'aria-label': 'Career impact highlights' },
          h('div', { className: 'react-impact-grid' }, cards.map(function (card) {
            return h('article', { className: 'react-impact-card', key: card[0] },
              h('span', { className: 'react-impact-label' }, card[0]),
              h('strong', { className: 'react-impact-value' }, card[1]),
              h('p', { className: 'react-impact-detail' }, card[2])
            );
          }))
        );
      }

      function WorkExplorer() {
        const h = React.createElement;
        const views = {
          architecture: {
            label: 'Architecture',
            title: 'Designing systems that can evolve',
            copy: 'I translate stakeholder needs into maintainable application architecture, making deliberate design decisions across APIs, authentication, data, and user workflows.',
            proof: ['NASA Earthdata Pub architect and lead developer', 'REST APIs supporting multiple applications', 'Modular MyWorkSpace data-order application']
          },
          modernization: {
            label: 'Modernization',
            title: 'Improving systems without losing their value',
            copy: 'I modernize established applications with practical changes that improve maintainability, testing, deployment confidence, and future platform growth.',
            proof: ['Perl-to-Python modernization', 'Automated unit and end-to-end testing', 'NASA cloud-hosted Earthdata migration support']
          },
          automation: {
            label: 'Automation',
            title: 'Turning repetitive work into reliable workflows',
            copy: 'I look for manual friction, then build scripts, pipelines, and integrations that make teams faster while protecting data quality.',
            proof: ['80% reduction in manual processing time', 'Publishing workflows reduced to one click', 'Metadata import/export pipelines across standards']
          }
        };
        const [active, setActive] = useState('architecture');
        const view = views[active];
        return h('section', { className: 'section section-alt', 'aria-label': 'How I work' },
          h('div', { className: 'container' },
            h('div', { className: 'react-explorer' },
              h('div', { className: 'react-explorer-head' },
                h('p', { className: 'react-explorer-kicker' }, 'Interactive overview'),
                h('h2', { className: 'react-explorer-title' }, 'How I create software impact')
              ),
              h('div', { className: 'react-explorer-tabs', role: 'group', 'aria-label': 'Select an area of focus' },
                Object.keys(views).map(function (key) {
                  return h('button', { key: key, className: 'react-explorer-tab', type: 'button', onClick: function () { setActive(key); }, 'aria-pressed': active === key }, views[key].label);
                })
              ),
              h('div', { className: 'react-explorer-content' },
                h('div', null, h('h3', null, view.title), h('p', { className: 'react-explorer-copy' }, view.copy)),
                h('div', { className: 'react-explorer-proof' }, view.proof.map(function (item) { return h('div', { className: 'react-proof', key: item }, item); }))
              )
            )
          )
        );
      }

      function Footer() {
        const h = React.createElement;
        const external = { target: '_blank', rel: 'noopener noreferrer' };
        return h('footer', { className: 'footer', id: 'contact' },
          h('div', { className: 'container' },
            h('h2', { className: 'footer-title' }, "Let's Connect"),
            h('p', { className: 'footer-sub' }, 'Open to opportunities in software architecture, full-stack development, and automation.'),
            h('div', { className: 'footer-links' },
              h('a', { href: 'mailto:kimberly.broughton@gmail.com', className: 'btn btn-nav-cta' }, '✉️ Email Me'),
              h('a', { href: 'kkb_08052026.pdf', className: 'btn btn-nav-cta', download: true }, '📄 Download Résumé'),
              h('a', { href: 'resume.html', className: 'btn btn-nav-cta', ...external }, '🖨️ Printable Version')
            ),
            h('div', { className: 'footer-profile-links' },
              h('a', { href: 'https://github.com/broughtonkkornl/Portfolio', ...external }, h(GitHubIcon), ' GitHub'),
              h('a', { href: 'https://broughtonkkornl.github.io/Portfolio/', ...external }, '🌐 Portfolio')
            ),
            h('ul', { className: 'hero-contact footer-contact' },
              h('li', null, '📍 Oliver Springs, TN 37840'),
              h('li', null, h('a', { href: 'tel:+18657429443' }, '📞 (865) 742-9443')),
              h('li', null, h('a', { href: 'mailto:kimberly.broughton@gmail.com' }, '✉️ kimberly.broughton@gmail.com')),
              h('li', null, h('a', { href: 'https://www.linkedin.com/in/kim-broughton', ...external }, '💼 LinkedIn'))
            ),
            h('p', { className: 'footer-copy' }, '© ' + new Date().getFullYear() + ' Kimberly K. Broughton • Built with React')
          )
        );
      }

      function PortfolioLayout(props) {
        const sections = props.sections;
        return React.createElement(React.Fragment, null,
          React.createElement(ScrollProgress),
          React.createElement(Navigation, { markup: sections.navigation }),
          React.createElement(Hero, { markup: sections.hero }),
          React.createElement(ImpactDashboard),
          React.createElement(About, { markup: sections.about }),
          React.createElement(Achievements, { markup: sections.achievements }),
          React.createElement(Skills, { markup: sections.skills }),
          React.createElement(Competencies, { markup: sections.competencies }),
          React.createElement(WorkExplorer),
          React.createElement(Experience, { markup: sections.experience }),
          React.createElement(Education, { markup: sections.education }),
          React.createElement(Footer)
        );
      }

      function Portfolio() {
        const [sections, setSections] = useState(null);
        const [error, setError] = useState('');

        useEffect(function () {
          fetch('index.html', { cache: 'no-store' })
            .then(function (response) {
              if (!response.ok) throw new Error('Unable to load the portfolio source.');
              return response.text();
            })
            .then(function (html) {
              const documentFragment = new DOMParser().parseFromString(html, 'text/html');
              documentFragment.querySelectorAll('script, base').forEach(function (element) { element.remove(); });
              const markupFor = function (selector) {
                const element = documentFragment.querySelector(selector);
                return element ? element.outerHTML : '';
              };
              setSections({
                navigation: markupFor('nav#navbar').replace(
                  'href="react-portfolio.html" class="nav-cta">React Version',
                  'href="index.html" class="nav-cta">Static Version'
                ),
                hero: markupFor('header#top'),
                about: markupFor('section#about'),
                achievements: markupFor('section#achievements'),
                skills: markupFor('section#skills'),
                competencies: markupFor('section#competencies'),
                experience: markupFor('section#experience'),
                education: markupFor('section#education'),
                footer: markupFor('footer#contact')
              });
            })
            .catch(function () {
              setError('Unable to load the portfolio. Please open this page through the site server.');
            });
        }, []);

        useEffect(function () {
          if (!sections || !window.location.hash) return undefined;
          const target = document.querySelector(window.location.hash);
          if (!target) return undefined;
          requestAnimationFrame(function () { target.scrollIntoView(); });
          return undefined;
        }, [sections]);

        usePortfolioInteractions(Boolean(sections));

        if (error) return React.createElement('main', { className: 'section' },
          React.createElement('div', { className: 'container' }, error));
        if (!sections) return React.createElement('main', { className: 'section' },
          React.createElement('div', { className: 'container' }, 'Loading portfolio…'));

        return React.createElement(PortfolioLayout, { sections: sections });
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Portfolio));
    })();
  </script>
</body>
</html>
