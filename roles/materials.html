<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    .materials-main { min-height: 100vh; padding: 8.5rem 1.5rem 5rem; }
    .materials-header { max-width: 920px; margin: 0 auto 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .materials-kicker { color: var(--accent); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
    .materials-title { color: var(--white); font-family: var(--font-display); font-size: clamp(1.75rem, 4vw, 2.5rem); margin-top: 0.3rem; }
    .document-paper { max-width: 920px; margin: 0 auto; padding: clamp(1.5rem, 5vw, 4rem); background: #fff; color: #1f2937; border-radius: var(--radius); box-shadow: 0 12px 50px rgba(0, 0, 0, 0.35); }
    .document-paper h1 { color: #172033; font-family: var(--font-display); font-size: clamp(1.7rem, 4vw, 2.35rem); margin: 0 0 1.5rem; }
    .document-paper h2 { color: #172033; font-family: var(--font-display); font-size: 1.2rem; margin: 2.25rem 0 0.85rem; padding-bottom: 0.45rem; border-bottom: 2px solid #4f8cff; }
    .document-paper h3 { color: #172033; font-size: 1rem; margin: 1.5rem 0 0.45rem; }
    .document-paper p, .document-paper li { line-height: 1.7; }
    .document-paper p { margin: 0 0 1rem; }
    .document-paper ul { padding-left: 1.3rem; margin: 0.65rem 0 1.25rem; }
    .document-paper li { margin-bottom: 0.55rem; }
    .document-paper a { color: #075985; text-decoration: underline; text-underline-offset: 0.15em; }
    .document-paper strong { color: #172033; }
    .document-error { text-align: center; color: #7f1d1d; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media print { .navbar, .materials-header .btn, .footer { display: none; } body { background: #fff; } .materials-main { padding: 0; } .document-paper { max-width: none; box-shadow: none; padding: 0; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <nav class="navbar" id="navbar" aria-label="Primary navigation">
    <div class="nav-inner">
      <a href="../index.html" class="brand" aria-label="KB — portfolio home">
        <svg class="brand-logo" viewBox="0 0 32 32" width="40" height="40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f8cff"/><stop offset="100%" stop-color="#37d5a4"/></linearGradient></defs><rect x="2" y="2" width="28" height="28" rx="7" stroke="url(#brandGrad)" stroke-width="1.5" fill="rgba(79,140,255,0.08)"/><text x="16" y="21.5" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="13" font-weight="700" fill="url(#brandGrad)">KB</text></svg>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-controls="navLinks" aria-expanded="false"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="../index.html">Portfolio</a></li>
        <li><a href="index.html" class="nav-cta">Role Versions</a></li>
        <li><a href="../resume.html" class="nav-cta" target="_blank" rel="noopener noreferrer">Printable Résumé</a></li>
      </ul>
    </div>
  </nav>

  <main class="materials-main" id="main-content">
    <div class="materials-header">
      <div><p class="materials-kicker">Application Materials</p><h1 class="materials-title" id="pageTitle">Loading document…</h1></div>
      <a class="btn btn-nav-cta" href="index.html">← All role versions</a>
    </div>
    <p id="loadStatus" class="sr-only" role="status">Loading application material…</p>
    <article class="document-paper" id="document" aria-busy="true">Loading application material…</article>
  </main>

  <footer class="footer"><p class="footer-copy">© 2026 Kimberly K. Broughton • Built with HTML, CSS &amp; JavaScript</p></footer>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../js/main.js"></script>
  <script>
    (function () {
      var documents = {
        'python-developer-cover-letter': ['Python Developer Cover Letter', 'python-developer-cover-letter.md'],
        'python-developer-interview-prep': ['Python Developer Interview Preparation', 'python-developer-interview-prep.md'],
        'front-end-developer-cover-letter': ['Front-End Developer Cover Letter', 'front-end-developer-cover-letter.md'],
        'front-end-developer-interview-prep': ['Front-End Developer Interview Preparation', 'front-end-developer-interview-prep.md'],
        'back-end-developer-cover-letter': ['Back-End Developer Cover Letter', 'back-end-developer-cover-letter.md'],
        'back-end-developer-interview-prep': ['Back-End Developer Interview Preparation', 'back-end-developer-interview-prep.md'],
        'full-stack-developer-cover-letter': ['Full-Stack Developer Cover Letter', 'full-stack-developer-cover-letter.md'],
        'full-stack-developer-interview-prep': ['Full-Stack Developer Interview Preparation', 'full-stack-developer-interview-prep.md'],
        'tech-lead-cover-letter': ['Tech Lead / Lead Programmer Cover Letter', 'tech-lead-cover-letter.md'],
        'tech-lead-interview-prep': ['Tech Lead / Lead Programmer Interview Preparation', 'tech-lead-interview-prep.md'],
        'senior-software-engineer-cover-letter': ['Senior Software Engineer Cover Letter', 'senior-software-engineer-cover-letter.md'],
        'senior-software-engineer-interview-prep': ['Senior Software Engineer Interview Preparation', 'senior-software-engineer-interview-prep.md']
      };
      var key = new URLSearchParams(window.location.search).get('document');
      var selected = documents[key];
      var title = document.getElementById('pageTitle');
      var output = document.getElementById('document');
      var status = document.getElementById('loadStatus');
      if (!selected) {
        title.textContent = 'Document not found';
        output.textContent = 'Choose a cover letter or interview guide from the role résumé library.';
        output.classList.add('document-error');
        output.setAttribute('aria-busy', 'false');
        status.textContent = 'Document not found.';
        return;
      }
      document.title = 'Kimberly K. Broughton — ' + selected[0];
      title.textContent = selected[0];
      fetch(selected[1], { cache: 'no-store' })
        .then(function (response) { if (!response.ok) throw new Error('Unable to load document'); return response.text(); })
        .then(function (markdown) { output.innerHTML = marked.parse(markdown); output.setAttribute('aria-busy', 'false'); status.textContent = selected[0] + ' loaded.'; })
        .catch(function () { output.textContent = 'Unable to load this document. Please return to the role résumé library and try again.'; output.classList.add('document-error'); output.setAttribute('aria-busy', 'false'); status.textContent = 'Unable to load document.'; });
    })();
  </script>
</body>
</html>
