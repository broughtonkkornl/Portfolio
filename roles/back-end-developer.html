<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kimberly K. Broughton — Back-End Developer</title>
  <style>
    :root { color: #1f2937; background: #eef2f7; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 2rem; }
    main { max-width: 850px; margin: 0 auto; padding: 3rem; background: #fff; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12); }
    h1 { margin-top: 0; font-size: 2rem; }
    h2 { margin-top: 2rem; padding-bottom: 0.35rem; border-bottom: 2px solid #1f2937; font-size: 1.2rem; text-transform: uppercase; }
    h3 { margin-bottom: 0.35rem; font-size: 1rem; }
    p, li { line-height: 1.45; }
    ul { padding-left: 1.25rem; }
    hr { margin: 1.6rem 0; border: 0; border-top: 1px solid #e5e7eb; }
    a { color: #075985; }
    :focus-visible { outline: 3px solid #0f766e; outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media print { body { padding: 0; background: #fff; } main { max-width: none; padding: 0; box-shadow: none; } }
  </style>
</head>
<body>
  <p id="loadStatus" class="sr-only" role="status">Loading tailored résumé…</p>
  <main id="preview" aria-busy="true">Loading tailored résumé…</main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('back-end-developer.md', { cache: 'no-store' })
      .then(function (response) { return response.text(); })
      .then(function (markdown) { var preview = document.getElementById('preview'); preview.innerHTML = marked.parse(markdown); preview.setAttribute('aria-busy', 'false'); document.getElementById('loadStatus').textContent = 'Tailored résumé loaded.'; })
      .catch(function () { var preview = document.getElementById('preview'); preview.textContent = 'Unable to load the tailored résumé.'; preview.setAttribute('aria-busy', 'false'); document.getElementById('loadStatus').textContent = 'Unable to load the tailored résumé.'; });
  </script>
</body>
</html>
