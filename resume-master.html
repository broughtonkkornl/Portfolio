<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kimberly K. Broughton — Master Résumé Preview</title>
  <style>
    :root { color: #1f2937; background: #eef2f7; font-family: Arial, sans-serif; }
    body { margin: 0; padding: 2rem; }
    main { max-width: 850px; margin: 0 auto; padding: 3rem; background: #fff; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12); }
    h1 { margin-top: 0; font-size: 2rem; }
    h2 { margin-top: 2rem; padding-bottom: 0.35rem; border-bottom: 2px solid #1f2937; font-size: 1.2rem; text-transform: uppercase; }
    h3 { margin-bottom: 0.35rem; font-size: 1rem; }
    p, li { line-height: 1.45; }
    ul { padding-left: 1.5rem; margin: 0.55rem 0 1rem; }
    ul ul { margin-top: 0.45rem; }
    .role-line, .credential-entry, .developed-line { margin: 0.2rem 0; }
    .role-date, .credential-date { float: right; color: #6b7280; font-weight: 400; white-space: nowrap; }
    .assessment-details { margin-top: 0.55rem; }
    .resume-group-divider { border: 0; height: 1px; background: #d9dde5; margin: 1rem 0; }
    .achievement-main { margin: 0.55rem 0; }
    a { color: #075985; }
    :focus-visible { outline: 3px solid #0f766e; outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    blockquote { margin: 0 0 1.5rem; padding: 0.75rem 1rem; border-left: 4px solid #0f766e; background: #f0fdfa; color: #334155; }
    @page { size: letter; margin: 0.45in 0.55in; }
    @media print { :root { font-size: 8.5pt; } body { padding: 0; background: #fff; font-size: 8.5pt; line-height: 1.2; } main { max-width: none; padding: 0; box-shadow: none; } blockquote { display: none; } h1 { font-size: 16pt; margin: 0 0 0.5rem; } h2 { font-size: 10pt; margin: 0.7rem 0 0.3rem; padding-bottom: 0.2rem; } h3 { font-size: 9pt; margin: 0.45rem 0 0.15rem; } p, li { line-height: 1.2; } p { margin: 0.15rem 0; } .achievement-main { margin: 0.3rem 0; } ul { margin: 0.25rem 0 0.45rem; padding-left: 1.15rem; } li { margin: 0; } hr { margin: 0.45rem 0; } }
  </style>
</head>
<body>
  <p id="loadStatus" class="sr-only" role="status">Loading master résumé…</p>
  <main id="preview" aria-busy="true">Loading master résumé…</main>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('resume-master.md', { cache: 'no-store' })
      .then(function (response) { return response.text(); })
      .then(function (markdown) {
        var preview = document.getElementById('preview');
        preview.innerHTML = marked.parse(markdown);
        preview.setAttribute('aria-busy', 'false');
        document.getElementById('loadStatus').textContent = 'Master résumé loaded.';
      })
      .catch(function () {
        var preview = document.getElementById('preview');
        preview.textContent = 'Unable to load the master résumé.';
        preview.setAttribute('aria-busy', 'false');
        document.getElementById('loadStatus').textContent = 'Unable to load the master résumé.';
      });
  </script>
</body>
</html>
